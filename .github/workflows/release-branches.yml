# ZenithDocs is not published to npm. Package managers cannot install a folder of a
# repository, so each package is copied to a branch of its own, with the package at its
# root, which `npx` and every package manager can install from GitHub:
#
#   npx github:AymericChaverot/zenith-docs#create my-docs
#   pnpm add github:AymericChaverot/zenith-docs#zenith-docs
#
# `git subtree split` keeps the history of the folder, so each run adds commits on top
# of the previous ones instead of rewriting the branch.
name: Release branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branches
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only what passes the checks reaches the branches people install from.
      - run: pnpm check
      - run: pnpm test

      - name: Push each package to its branch
        run: |
          git push --force origin "$(git subtree split --prefix=packages/zenith-docs):refs/heads/zenith-docs"
          git push --force origin "$(git subtree split --prefix=packages/create-zenith-docs):refs/heads/create"
