# ZenithDocs installs straight from this repository, so `main` is what people get:
# every push and pull request is type checked, tested, and builds the docs and the example.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter zero-config-example build
